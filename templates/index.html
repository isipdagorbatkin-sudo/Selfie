<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/icons/avatar.jpg" />
    <title>Сильфи</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <main class="app-shell">
      <header class="topbar">
        <div class="avatar-wrap">
          <img
            id="animeAvatar"
            class="avatar"
            src="/static/icons/avatar.jpg"
            alt="Сильфи"
          />
        </div>
        <div class="title-wrap">
          <h1>Сильфи</h1>
          <p id="statusLine">онлайн</p>
        </div>
      </header>

      <section id="chat" class="chat" aria-live="polite"></section>

      <div id="typingIndicator" class="typing hidden" role="status" aria-live="polite">
        <span>Печатает…</span>
        <div class="dots">
          <i></i><i></i><i></i>
        </div>
      </div>

      <form id="chatForm" class="composer" autocomplete="off">
        <input
          id="messageInput"
          type="text"
          placeholder="Сообщение"
          maxlength="1000"
          required
        />
        <button type="submit" aria-label="Отправить">➤</button>
      </form>
    </main>

    <div id="lightbox" class="lightbox">
      <button class="lightbox-close" aria-label="Закрыть">&times;</button>
      <img id="lightboxImg" src="" alt="Аватар" />
    </div>

    <script src="/static/js/app.js"></script>
  </body>
</html>
